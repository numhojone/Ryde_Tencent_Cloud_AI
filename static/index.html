<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RydeResolve | Multi-agent dispute resolution</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">RR</div>
    <div>
      <h1>RydeResolve</h1>
      <p class="tag" data-i18n="tagline">Multi-agent autonomous dispute resolution · Tencent Cloud AI CAN DO IT 2026</p>
    </div>
  </div>
  <div class="controls">
    <div class="lang-toggle" id="langToggle" role="group" aria-label="Language">
      <button type="button" data-lang="en" class="on">EN</button>
      <button type="button" data-lang="zh">中文</button>
    </div>
    <div class="mode-badge" id="modeBadge" data-i18n="loading">Loading…</div>
    <select id="backendSelect" class="select select-sm" data-i18n-title="backendTitle" title="Choose the backend that drives the agents">
      <option value="llm" data-i18n="beLlm">Live AI</option>
      <option value="deterministic" data-i18n="beDet">Offline demo</option>
    </select>
    <span class="mode-badge det" id="offlineTag" data-i18n="offlineDemoTag" hidden>Offline demo (scripted agents)</span>
    <select id="disputeSelect" class="select" disabled data-i18n-title="presetTitle" title="Preset tickets, one-click replay"></select>
    <button id="runBtn" class="btn" disabled data-i18n="replay">Replay</button>
  </div>
</header>

<nav class="roster" id="roster" aria-label="Participants"></nav>

<main class="chat">
  <div class="chat-inner" id="chat">
    <div class="empty-state" id="emptyState" data-i18n-html="emptyHint"></div>
    <div class="typing-zone" id="typingZone" aria-live="polite"></div>
  </div>
</main>

<footer class="composer">
  <div class="composer-inner">
    <div class="samples">
      <span class="chip-hint" data-i18n="tryHint">Try:</span>
      <button class="chip" data-text="The driver took a much longer route from Orchard Central to Changi Airport and I was overcharged for it." data-i18n="chipEn">English</button>
      <button class="chip" data-text="Driver never turn up at Tiong Bahru Plaza leh, I wait so long still kena charge $5 cancel fee. Not fair sia." data-i18n="chipSl">Singlish</button>
      <button class="chip" data-text="Saya tunggu di Tiong Bahru Plaza tetapi pemandu tidak datang, dan saya dikenakan caj pembatalan $5." data-i18n="chipMs">Malay</button>
      <button class="chip" data-text="நான் Tiong Bahru Plaza இல் காத்திருந்தேன், ஓட்டுநர் வரவில்லை, ஆனாலும் $5 ரத்து கட்டணம் வசூலிக்கப்பட்டது." data-i18n="chipTa">Tamil</button>
      <button class="chip" data-text="The fare was $16.50 but the upfront quote was $12.00. Nobody told me the price had gone up." data-i18n="chipFare">Fare</button>
      <button class="chip" data-text="I was charged a S$35 cleaning fee but the car was clean when I got out. I never spilled anything." data-i18n="chipProp">Cleaning fee</button>
      <button class="chip" data-text="The driver was speeding over 100 km/h and shouted at me when I asked him to slow down. I felt really unsafe." data-i18n="chipSafe">Safety</button>
      <button class="chip" data-text="司机从Orchard Central到樟宜机场绕了一大圈，本来三十公里走了四十多公里，多收了我不少钱" data-i18n="chipZh">Chinese</button>
      <button class="chip" data-text="Something went wrong with my last ride and I want my money back." data-i18n="chipVague">Vague</button>
    </div>
    <div class="composer-bar">
      <div class="trip-pick">
        <label class="lbl-sm" for="tripSelect" data-i18n="tripLbl">Trip</label>
        <select id="tripSelect" class="select" disabled></select>
      </div>
      <textarea id="complaintInput" rows="1" maxlength="2000" data-i18n-ph="placeholder"
        placeholder="e.g. The driver went round and round and the fare was way higher than the estimate"></textarea>
      <button id="fileBtn" class="btn primary" disabled data-i18n="submit">Submit and rule</button>
    </div>
    <div class="composer-foot" data-i18n="fileFoot">Your story picks the category and the trip; the platform's own records (GPS, chat, fares, app events) decide the ruling.</div>
  </div>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
